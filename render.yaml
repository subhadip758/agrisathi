services:
  - type: web
    name: agrisathi-backend
    env: node
    rootDir: backend
    buildCommand: npm install && pip install -r requirements.txt
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
